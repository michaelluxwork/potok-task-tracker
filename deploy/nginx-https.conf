map $request_method $potok_post_ip { default ""; POST $binary_remote_addr; }
map $request_method $potok_post_global { default ""; POST potok; }
limit_req_zone $potok_post_ip zone=potok_login:1m rate=6r/m;
limit_req_zone $potok_post_ip zone=potok_signup:1m rate=2r/m;
limit_req_zone $potok_post_ip zone=potok_writes:1m rate=30r/m;
limit_req_zone $potok_post_global zone=potok_global:1m rate=60r/m;
server {
    listen 443 ssl;
    server_name potok.178-255-126-110.sslip.io;
    ssl_certificate /etc/letsencrypt/live/potok.178-255-126-110.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potok.178-255-126-110.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 64k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 502 504 = @bounded_error;
    location @bounded_error {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 503 "Temporarily unavailable or request limit reached. Wait before retrying. No changes confirmed.\n";
    }
    location = /accounts/login/ {
        limit_req zone=potok_login burst=8 nodelay;
        limit_req zone=potok_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:4366;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
    location = /accounts/signup/ {
        limit_req zone=potok_signup burst=3 nodelay;
        limit_req zone=potok_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:4366;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
    location / {
        limit_req zone=potok_writes burst=20 nodelay;
        limit_req zone=potok_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:4366;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
    error_page 413 = @potok_413;
    location @potok_413 {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 413 "Form too large. No changes confirmed.\n";
    }
    error_page 429 = @potok_429;
    location @potok_429 {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 429 "Request limit reached. Wait before retrying. No changes confirmed.\n";
    }
}
